<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>404 | DexAI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #0a1b3d 0%, #0f2847 50%, #0a1b3d 100%);
        color: #fff;
        font-family: "Noto Sans JP", Inter, system-ui, sans-serif;
        text-align: center;
      }
      .eyebrow {
        color: #38bdf8;
        font-size: 14px;
        letter-spacing: 0.3em;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 12px;
      }
      p {
        color: rgba(255, 255, 255, 0.7);
        font-size: 14px;
        line-height: 1.7;
        margin: 0 0 32px;
      }
      .en {
        display: none;
      }
      html[data-lang="en"] .ja {
        display: none;
      }
      html[data-lang="en"] .en {
        display: block;
      }
      a.btn {
        display: inline-block;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        border-radius: 9999px;
        padding: 12px 32px;
        font-size: 14px;
      }
      a.btn:hover {
        background: #1d4ed8;
      }
    </style>
    <script>
      var lang = (navigator.language || "ja").toLowerCase();
      if (lang.indexOf("ja") !== 0) {
        document.documentElement.setAttribute("data-lang", "en");
      }
    </script>
  </head>
  <body>
    <div>
      <div class="eyebrow">404</div>
      <div class="ja">
        <h1>ページが見つかりません</h1>
        <p>お探しのページは移動または削除された可能性があります。</p>
        <a class="btn" href="/ja/">トップページへ戻る →</a>
      </div>
      <div class="en">
        <h1>Page Not Found</h1>
        <p>The page you are looking for may have been moved or removed.</p>
        <a class="btn" href="/en/">Back to Home →</a>
      </div>
    </div>
  </body>
</html>
